# Met à jour automatiquement les ventes DVF de Loire-Atlantique (le 5 de chaque mois)
# puis republie le site. Aucune action manuelle nécessaire.
name: Mise à jour des ventes DVF 44

on:
  schedule:
    - cron: "17 4 5 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dvf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Préparer les ventes
        run: python scripts/build_dvf.py --source-dir sources
      - name: Enregistrer si les données ont changé
        run: |
          git config user.name "monesti44-robot"
          git config user.email "robot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Mise à jour des ventes DVF 44"
          git push
